aid: ossium-health
name: Ossium Health
description: >-
  Ossium Health is a bioengineering company developing off-the-shelf cell
  therapies manufactured from stem cells recovered from deceased organ and
  tissue donors. The company operates a proprietary bone marrow and tissue
  recovery, banking, and manufacturing platform, and is advancing a clinical
  pipeline of allogeneic cellular therapies targeting hematologic diseases,
  organ transplant tolerance, and orthopedic conditions. Ossium Health is a
  private, venture-backed life sciences company; it does not currently publish
  a public developer program, API, or SDKs. This profile is maintained in the
  API Evangelist network as a company/provider record and was surfaced as a
  portfolio company of General Catalyst.
